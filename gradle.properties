# Give Loom and the decompiler room to work. Building on a laptop with 8 GB
# still works with this value; lower it only if you also lower the Gradle daemon.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=true

# Fabric properties, checked against https://fabricmc.net/develop
