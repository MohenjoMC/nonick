loader_version=0.19.5
loom_version=1.18-SNAPSHOT

# Mod properties
mod_version=1.0.0
maven_group=com.monhenjo.nonick
archives_base_name=nonick

# Dependencies
fabric_api_version=0.164.0+26.3
cloth_config_version=26.3.159
modmenu_version=21.0.0
