# Build one jar for every Minecraft 26.x release.
name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - mc: "26.1"
            api: "0.155.3+26.1.2"
            cloth: "26.1.154"
            modmenu: "18.0.2"
            mc_dep: "~26.1"
            cloth_dep: ">=26.1.0"
          - mc: "26.1.1"
            api: "0.155.3+26.1.2"
            cloth: "26.1.154"
            modmenu: "18.0.2"
            mc_dep: "~26.1"
            cloth_dep: ">=26.1.0"
          - mc: "26.1.2"
            api: "0.155.3+26.1.2"
            cloth: "26.1.154"
            modmenu: "18.0.2"
            mc_dep: "~26.1"
            cloth_dep: ">=26.1.0"
          - mc: "26.2"
            api: "0.161.0+26.2"
            cloth: "26.2.155"
            modmenu: "20.0.3"
            mc_dep: "~26.2"
            cloth_dep: ">=26.2.0"
          - mc: "26.3"
            api: "0.164.0+26.3"
            cloth: "26.3.159"
            modmenu: "21.0.0"
            mc_dep: "~26.3"
            cloth_dep: ">=26.3.0"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: "microsoft"

      - name: Build for Minecraft ${{ matrix.mc }}
        run: |
          chmod +x ./gradlew
          ./gradlew build --stacktrace \
            -Pminecraft_version="${{ matrix.mc }}" \
            -Pfabric_api_version="${{ matrix.api }}" \
            -Pcloth_config_version="${{ matrix.cloth }}" \
            -Pmodmenu_version="${{ matrix.modmenu }}" \
            -Pminecraft_dependency="${{ matrix.mc_dep }}" \
            -Pcloth_config_dependency="${{ matrix.cloth_dep }}"

      - name: Upload Minecraft ${{ matrix.mc }} jars
        uses: actions/upload-artifact@v7
        with:
          name: nonick-${{ matrix.mc }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
